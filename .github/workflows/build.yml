name: Build RandomlyThingies

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build and package
        run: |
          xmake f -y -p android -a arm64-v8a -m release --ndk=${{ steps.ndk.outputs.ndk-path }}
          xmake -y

      - uses: actions/upload-artifact@v4
        with:
          name: RandomlyThingies-build
          path: |
            build/android/arm64-v8a/release/libRandomlyThingies.so
            build/android/arm64-v8a/release/RandomlyThingies.levipack
          if-no-files-found: error
